<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Daily Planner</title>
    <style>
        :root {
            --paper-bg: #ffffff;
            --line-color: #e2e8f0;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --bg-page: #f1f5f9;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .planner-page {
            background: var(--paper-bg);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #cbd5e1;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 3px solid var(--text-main);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .date-section {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--line-color);
            padding-bottom: 5px;
        }

        /* Schedule Section */
        .schedule-container {
            display: flex;
            flex-direction: column;
        }

        .time-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line-color);
            transition: background 0.2s;
        }

        .time-label {
            font-size: 0.8rem;
            font-weight: 600;
            width: 50px;
            color: var(--text-dim);
            text-align: right;
            padding-right: 10px;
        }

        .task-input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            padding: 4px 0;
        }

        .checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .completed {
            text-decoration: line-through;
            color: var(--text-dim);
            opacity: 0.6;
        }

        /* Top Priorities Section */
        .priorities-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .priority-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line-color);
        }

        .priority-num {
            font-weight: 800;
            color: var(--accent-color);
            font-size: 1.2rem;
            width: 20px;
        }

        .priority-input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 1rem;
            outline: none;
            color: var(--text-main);
        }

        /* Footer Actions */
        .footer-actions {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--line-color);
            padding-top: 20px;
        }

        .status-bar {
            font-size: 0.8rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-dim);
            border-top: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sync-btn {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sync-btn:hover {
            background: var(--accent-color);
        }

        @media print {
            body { background: white; padding: 0; }
            .planner-page { box-shadow: none; border: none; }
            .sync-btn, .status-bar { display: none; }
        }
    </style>
</head>
<body>

<div class="planner-page">
    <div class="header">
        <h1>Daily Planner</h1>
        <div class="date-section" id="current-date">Loading Date...</div>
    </div>

    <div class="main-layout">
        <!-- Left Side: Schedule -->
        <div class="schedule-container">
            <div class="section-title">📅 Schedule</div>
            <div id="schedule-grid">
                <!-- Time slots generated by JS -->
            </div>
        </div>

        <!-- Right Side: Top Priorities & Notes -->
        <div class="priorities-container">
            <div class="section-title">⭐ Top Priorities</div>
            <div class="priority-item">
                <span class="priority-num">1</span>
                <input type="text" class="priority-input" data-id="p1" placeholder="Most important task..." oninput="autoSave()">
            </div>
            <div class="priority-item">
                <span class="priority-num">2</span>
                <input type="text" class="priority-input" data-id="p2" placeholder="Secondary task..." oninput="autoSave()">
            </div>
            <div class="priority-item">
                <span class="priority-num">3</span>
                <input type="text" class="priority-input" data-id="p3" placeholder="Third priority..." oninput="autoSave()">
            </div>

            <div class="section-title" style="margin-top: 30px;">📝 Notes & Reminders</div>
            <textarea id="notes" style="width: 100%; height: 200px; background: transparent; border: 1px solid var(--line-color); border-radius: 8px; padding: 15px; outline: none; font-family: inherit; font-size: 1rem; color: var(--text-main); resize: none;" placeholder="Write down your thoughts for the day..." oninput="autoSave()"></textarea>
        </div>
    </div>

    <div class="footer-actions">
        <div class="status-bar" id="status">
            <div class="spinner" id="spinner"></div>
            <span id="status-text">Ready</span>
        </div>
        <button class="sync-btn" onclick="saveToBackend()">Sync to Cloud</button>
    </div>
</div>

<script>
    const hours = [
        "5am", "6am", "7am", "8am", "9am", "10am", "11am", "12pm",
        "1pm", "2pm", "3pm", "4pm", "5pm", "6pm", "7pm", "8pm",
        "9pm", "10pm", "11pm", "12am"
    ];

    const scheduleGrid = document.getElementById('schedule-grid');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');

    // Set current date
    const now = new Date();
    document.getElementById('current-date').innerText = now.toDateString();

    // Generate Time Slots
    hours.forEach(time => {
        const div = document.createElement('div');
        div.className = 'time-slot';
        div.innerHTML = `
            <span class="time-label">${time}</span>
            <input type="checkbox" class="checkbox" data-time="${time}" onchange="updateStyle(this)">
            <input type="text" class="task-input" data-time="${time}" placeholder="..." oninput="autoSave()">
        `;
        scheduleGrid.appendChild(div);
    });

    function updateStyle(cb) {
        const input = cb.nextElementSibling;
        cb.checked ? input.classList.add('completed') : input.classList.remove('completed');
        autoSave();
    }

    function getAppData() {
        const data = {
            schedule: {},
            priorities: {},
            notes: document.getElementById('notes').value
        };

        document.querySelectorAll('.time-slot').forEach(slot => {
            const time = slot.querySelector('.time-label').innerText;
            data.schedule[time] = {
                text: slot.querySelector('.task-input').value,
                done: slot.querySelector('.checkbox').checked
            };
        });

        document.querySelectorAll('.priority-input').forEach(input => {
            data.priorities[input.dataset.id] = input.value;
        });

        return data;
    }

    async function saveToBackend() {
        updateStatus("Syncing...", "saving");
        try {
            const response = await fetch('/.netlify/functions/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tasks: getAppData() })
            });

            if (response.ok) {
                updateStatus("✅ All synced!", "saved");
            } else {
                throw new Error("Sync failed");
            }
        } catch (e) {
            updateStatus("Error: " + e.message, "error");
        }
    }

    async function loadFromBackend() {
        updateStatus("Loading...", "saving");
        try {
            // Load directly from GitHub Public API for reading
            const repo = "YOUR_USERNAME/YOUR_REPO";
            const path = "todos.json";
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`);
            if (res.ok) {
                const data = await res.json();
                const appData = JSON.parse(atob(data.content));

                // Load Schedule
                document.querySelectorAll('.time-slot').forEach(slot => {
                    const time = slot.querySelector('.time-label').innerText;
                    if (appData.schedule && appData.schedule[time]) {
                        slot.querySelector('.task-input').value = appData.schedule[time].text;
                        slot.querySelector('.checkbox').checked = appData.schedule[time].done;
                        if (appData.schedule[time].done) slot.querySelector('.task-input').classList.add('completed');
                    }
                });

                // Load Priorities
                document.querySelectorAll('.priority-input').forEach(input => {
                    if (appData.priorities && appData.priorities[input.dataset.id]) {
                        input.value = appData.priorities[input.dataset.id];
                    }
                });

                // Load Notes
                if (appData.notes) document.getElementById('notes').value = appData.notes;

                updateStatus("Cloud data loaded", "saved");
            } else {
                updateStatus("Ready", "ready");
            }
        } catch (e) {
            updateStatus("Load failed", "error");
        }
    }

    function updateStatus(text, type) {
        statusText.innerText = text;
        spinner.style.display = (type === "saving") ? "block" : "none";
        const bar = document.getElementById('status');
        bar.className = "status-bar";
        if (type === "saving") bar.classList.add("status-saving");
        if (type === "saved") bar.classList.add("status-saved");
    }

    let saveTimeout;
    function autoSave() {
        updateStatus("Typing...", "ready");
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveToBackend, 3000);
    }

    window.addEventListener('beforeunload', saveToBackend);
    window.onload = loadFromBackend;
</script>
</body>
</html>
